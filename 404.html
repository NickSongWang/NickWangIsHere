  <style>
    /* ---------- 404 专属样式（使用全站变量，自动适配明暗主题） ---------- */
    .nf {
      min-height: calc(100vh - 62px);
      display: flex; align-items: center; justify-content: center;
      padding: 60px 20px 80px; text-align: center;
    }
    .nf-inner { max-width: 640px; }
    .nf-kicker {
      font-family: var(--sans); font-size: 12px; letter-spacing: 4px;
      color: var(--muted); margin-bottom: 28px;
    }
    /* 没有曝光的底片框 */
    .nf-frame {
      position: relative; margin: 0 auto 34px; width: 240px; aspect-ratio: 3/2;
      border: 2px solid var(--line); border-radius: 6px;
      background:
        linear-gradient(160deg, transparent 0 42%, rgba(212,162,78,.10) 42% 47%, transparent 47%),
        linear-gradient(200deg, transparent 0 30%, rgba(212,162,78,.07) 30% 34%, transparent 34%),
        var(--panel, var(--bg));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      transform: rotate(-2.5deg);
    }
    .nf-frame::before, .nf-frame::after {
      content: ""; position: absolute; left: 10px; right: 10px; height: 9px;
      background: var(--bg);
      -webkit-mask: repeating-linear-gradient(90deg, #000 0 12px, transparent 12px 22px);
      mask: repeating-linear-gradient(90deg, #000 0 12px, transparent 12px 22px);
    }
    .nf-frame::before { top: 7px; }
    .nf-frame::after { bottom: 7px; }
    .nf-frame .x {
      font-family: var(--serif); font-size: 74px; font-weight: 700;
      color: var(--txt); opacity: .28; letter-spacing: 6px; user-select: none;
    }
    /* 手写批注：划过底片的叉 */
    .nf-scratch {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .nf h1 { font-size: 42px; margin: 0 0 6px; }
    .nf .cir { position: relative; display: inline-block; }
    .nf .cir svg {
      position: absolute; inset: -8px -12px; width: calc(100% + 24px); height: calc(100% + 16px);
    }
    .nf .zh { margin-top: 4px; }
    .nf .exif { justify-content: center; margin: 26px 0 34px; }
    .nf-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .nf-links a {
      display: inline-block; padding: 10px 22px; border: 1.5px solid var(--accent);
      border-radius: 999px; color: var(--accent); text-decoration: none;
      font-family: var(--sans); font-size: 14px; letter-spacing: 1px;
      transition: .25s;
    }
    .nf-links a:hover { background: var(--accent); color: var(--bg); transform: translateY(-2px); }
    .nf-links a.primary { background: var(--accent); color: var(--bg); }
    .nf-links a.primary:hover { filter: brightness(1.1); }
    @media (max-width: 640px) {
      .nf h1 { font-size: 32px; }
      .nf-frame { width: 190px; }
      .nf-frame .x { font-size: 56px; }
    }
