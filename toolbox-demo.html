<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱演示 · TOOLBOX DEMO</title>
<style>
  :root{
    --bg:#14110d; --stage:#100d09; --panel:#1e1a14; --panel2:#262017;
    --gold:#d4a24e; --gold-l:#e8c47a; --ink:#e8e4dc; --muted:#8f8a80;
    --line:rgba(212,162,78,.18); --line2:rgba(212,162,78,.4);
    --teal:#5DCAA5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
    background-image:radial-gradient(circle at 18% 0%, rgba(212,162,78,.06), transparent 42%),
                     radial-gradient(circle at 82% 100%, rgba(212,162,78,.05), transparent 42%);
  }
  .app{display:flex;flex-direction:column;height:100vh}

  /* 顶部栏 */
  .topbar{
    flex-shrink:0;display:flex;align-items:baseline;gap:14px;
    padding:14px 22px;border-bottom:1px solid var(--line);
  }
  .topbar .logo{font-size:18px;font-weight:500;letter-spacing:1px}
  .topbar .logo b{color:var(--gold);font-weight:500}
  .topbar .sub{font-size:12px;color:var(--muted)}

  /* 舞台（占满剩余空间） */
  .stage{flex:1;position:relative;overflow:hidden;min-height:0}

  /* 启动器层：工具卡片铺满舞台 */
  .launcher{position:absolute;inset:0;padding:22px;overflow:auto;z-index:1}
  .launcher .tip{font-size:12px;color:var(--muted);margin:2px 2px 16px;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:8px}
  .tool-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px 18px;cursor:pointer;transition:border-color .15s, transform .15s, background .15s;
    user-select:none;min-height:132px;
  }
  .tool-card:hover{border-color:var(--line2);transform:translateY(-3px)}
  .tool-card .ic{font-size:26px;color:var(--gold);font-weight:500;height:34px}
  .tool-card h3{font-size:16px;font-weight:500;margin:10px 0 5px}
  .tool-card p{font-size:12px;color:var(--muted);line-height:1.5}
  .tool-card.open{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}

  /* 窗口层：全屏铺满舞台，覆盖卡片 */
  .win{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    background:var(--panel);border-top:1px solid var(--line);
  }
  .win .bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 16px;background:var(--panel2);border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .win .bar .ttl{font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px}
  .win .bar .ttl .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .win.active .bar{border-bottom-color:var(--line2)}
  .win.active .bar .ttl .dot{background:var(--gold)}
  .win .bar .btns{display:flex;gap:7px}
  .win .bar button{
    width:28px;height:28px;border-radius:7px;border:1px solid transparent;
    background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;
    transition:all .12s;display:flex;align-items:center;justify-content:center;
  }
  .win .bar button:hover{border-color:var(--line2);color:var(--ink);background:rgba(212,162,78,.1)}
  .win .bar .x:hover{color:#e07a5f;border-color:rgba(224,122,95,.4);background:rgba(224,122,95,.12)}

  .win .body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:32px}
  .ph-wrap{max-width:640px;width:100%;text-align:center}
  .ph-ic{font-size:52px;color:var(--gold);font-weight:500;line-height:1}
  .ph-title{font-size:20px;font-weight:500;color:var(--gold-l);margin:18px 0 8px}
  .ph-desc{font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.6}
  .mock{
    background:var(--panel2);border:1px dashed var(--line2);border-radius:12px;
    padding:22px;font-size:15px;color:var(--ink);line-height:2;text-align:left;
  }
  .mock .k{color:var(--gold)}
  .mock .res{color:var(--teal);font-weight:500}
  .ph-note{margin-top:22px;font-size:11px;color:var(--muted);letter-spacing:2px}

  /* 任务栏 */
  .dock{
    flex-shrink:0;display:flex;gap:10px;margin:14px 22px 16px;padding:12px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    min-height:64px;flex-wrap:wrap;
  }
  .dock .cap{width:100%;font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:2px}
  .dock-item{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
    min-width:62px;padding:8px 10px;border-radius:10px;border:1px solid transparent;
    background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
  }
  .dock-item:hover{background:rgba(212,162,78,.08);color:var(--ink)}
  .dock-item .ic{font-size:18px}
  .dock-item .nm{font-size:11px}
  .dock-item .st{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:50%;background:transparent}
  .dock-item.open{color:var(--ink)}
  .dock-item.open .ic{color:var(--gold)}
  .dock-item.open.active .st{background:var(--gold)}
  .dock-item.min .ic{color:var(--teal)}
  .dock-item.min .st{background:var(--teal);opacity:.7}
  .dock-empty{font-size:12px;color:var(--muted);align-self:center}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo">NICK<b>WANG</b></span>
    <span class="sub">暗房工作台 · TOOLBOX</span>
  </div>

  <div class="stage" id="stage">
    <div class="launcher" id="launcher">
      <div class="tip">选择工具打开 —— 窗口将铺满本区域 · 最小化回到这里 · 点「×」才关闭</div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="dock" id="dock"></div>
</div>

<script>
(function(){
  'use strict';

  var TOOLS = [
    { id:'resistor', name:'电阻色环', icon:'Ω', desc:'色环颜色 → 阻值与误差',
      body:'<div class="ph-wrap"><div class="ph-ic">Ω</div><div class="ph-title">电阻色环计算器</div><div class="ph-desc">选择四色环颜色，自动计算阻值与误差。</div>'+
           '<div class="mock"><span class="k">色环</span>：棕 · 黑 · 红 · 金<br><span class="k">阻值</span>：<span class="res">1.0 kΩ ± 5%</span></div>'+
           '<div class="ph-note">演示占位 · 后续接入真实计算</div></div>' },
    { id:'db', name:'dB 换算', icon:'dB', desc:'分贝 ↔ 电压/功率倍数',
      body:'<div class="ph-wrap"><div class="ph-ic">dB</div><div class="ph-title">分贝换算</div><div class="ph-desc">在 dB 与电压、功率倍数之间换算。</div>'+
           '<div class="mock"><span class="k">电压</span>：20·lg(V₂/V₁)<br><span class="k">功率</span>：10·lg(P₂/P₁)<br><span class="k">示例</span>：6 dB ≈ <span class="res">2× 电压</span></div>'+
           '<div class="ph-note">演示占位 · 后续接入真实计算</div></div>' },
    { id:'bpm', name:'BPM 延迟', icon:'BPM', desc:'拍速 ↔ 延迟时间(ms)',
      body:'<div class="ph-wrap"><div class="ph-ic">BPM</div><div class="ph-title">BPM ↔ 延迟时间</div><div class="ph-desc">按拍速换算四分/八分音符的延迟毫秒数。</div>'+
           '<div class="mock"><span class="k">120 BPM</span> 四分音符 = <span class="res">500 ms</span><br><span class="k">附点八分</span> = 375 ms</div>'+
           '<div class="ph-note">演示占位 · 后续接入真实计算</div></div>' },
    { id:'divider', name:'分压电阻', icon:'÷', desc:'Vout = Vin·R2/(R1+R2)',
      body:'<div class="ph-wrap"><div class="ph-ic">÷</div><div class="ph-title">分压电阻计算</div><div class="ph-desc">给定输入电压与两个电阻，算出分压输出。</div>'+
           '<div class="mock"><span class="k">Vin</span> 5V · <span class="k">R1</span> 10k · <span class="k">R2</span> 10k<br><span class="k">Vout</span> = <span class="res">2.5 V</span></div>'+
           '<div class="ph-note">演示占位 · 后续接入真实计算</div></div>' },
    { id:'rc', name:'RC 常数', icon:'τ', desc:'τ = R·C 充放电时间',
      body:'<div class="ph-wrap"><div class="ph-ic">τ</div><div class="ph-title">RC 时间常数</div><div class="ph-desc">由电阻与电容计算充放电时间常数。</div>'+
           '<div class="mock"><span class="k">R</span> 1 kΩ · <span class="k">C</span> 1 µF<br><span class="k">τ</span> = <span class="res">1 ms</span>（约 5τ 充满）</div>'+
           '<div class="ph-note">演示占位 · 后续接入真实计算</div></div>' },
    { id:'led', name:'LED 限流', icon:'LED', desc:'R = (Vs−Vf)/I',
      body:'<div class="ph-wrap"><div class="ph-ic">LED</div><div class="ph-title">LED 限流电阻</div><div class="ph-desc">由电源电压、LED 压降与工作电流算限流电阻。</div>'+
           '<div class="mock"><span class="k">Vs</span> 5V · <span class="k">Vf</span> 2V · <span class="k">I</span> 20 mA<br><span class="k">R</span> = <span class="res">150 Ω</span></div>'+
           '<div class="ph-note">演示占位 · 后续接入真实计算</div></div>' }
  ];

  var winMap = {};
  var zTop = 10;
  var activeId = null;

  var stageEl = document.getElementById('stage');
  var gridEl = document.getElementById('grid');
  var dockEl = document.getElementById('dock');

  gridEl.innerHTML = TOOLS.map(function(t){
    return '<div class="tool-card" data-id="'+t.id+'">'+
      '<div class="ic">'+t.icon+'</div>'+
      '<h3>'+t.name+'</h3><p>'+t.desc+'</p></div>';
  }).join('');

  gridEl.addEventListener('click', function(e){
    var card = e.target.closest('.tool-card');
    if(!card) return;
    openTool(card.getAttribute('data-id'));
  });

  function openTool(id){
    if(winMap[id]){
      if(winMap[id].status === 'min') restoreTool(id); else focusTool(id);
      return;
    }
    var t = TOOLS.filter(function(x){return x.id===id;})[0];
    var el = document.createElement('div');
    el.className = 'win';
    el.innerHTML =
      '<div class="bar"><span class="ttl"><span class="dot"></span>'+t.name+'</span>'+
      '<span class="btns"><button class="mn" title="最小化">–</button><button class="x" title="关闭">×</button></span></div>'+
      '<div class="body">'+t.body+'</div>';
    stageEl.appendChild(el);
    winMap[id] = { status:'open', el:el };
    markCard(id, true);
    renderDock();
    focusTool(id);
    bindWin(id);
  }

  function focusTool(id){
    var w = winMap[id]; if(!w || w.status!=='open') return;
    w.el.style.zIndex = ++zTop;
    if(activeId && winMap[activeId]) winMap[activeId].el.classList.remove('active');
    activeId = id;
    w.el.classList.add('active');
    renderDock();
  }

  function minimizeTool(id){
    var w = winMap[id]; if(!w || w.status!=='open') return;
    w.status = 'min';
    w.el.style.display = 'none';
    if(activeId === id) activeId = null;
    renderDock();
  }

  function restoreTool(id){
    var w = winMap[id]; if(!w || w.status!=='min') return;
    w.status = 'open';
    w.el.style.display = 'flex';
    renderDock();
    focusTool(id);
  }

  function closeTool(id){
    var w = winMap[id]; if(!w) return;
    if(w.el && w.el.parentNode) w.el.parentNode.removeChild(w.el);
    delete winMap[id];
    if(activeId === id) activeId = null;
    markCard(id, false);
    renderDock();
  }

  function bindWin(id){
    var w = winMap[id];
    w.el.addEventListener('mousedown', function(){ focusTool(id); });
    w.el.querySelector('.mn').addEventListener('click', function(e){ e.stopPropagation(); minimizeTool(id); });
    w.el.querySelector('.x').addEventListener('click', function(e){ e.stopPropagation(); closeTool(id); });
  }

  function markCard(id, on){
    var card = gridEl.querySelector('.tool-card[data-id="'+id+'"]');
    if(card) card.classList.toggle('open', on);
  }

  function renderDock(){
    var ids = Object.keys(winMap);
    var cap = '<div class="cap">DOCK · 已打开 ' + ids.length + ' 个工具</div>';
    if(!ids.length){ dockEl.innerHTML = cap + '<span class="dock-empty">任务栏为空 —— 打开一个工具试试</span>'; return; }
    dockEl.innerHTML = cap + ids.map(function(id){
      var w = winMap[id];
      var t = TOOLS.filter(function(x){return x.id===id;})[0];
      var cls = 'dock-item ' + w.status + (w.status==='open' && activeId===id ? ' active' : '');
      return '<button class="'+cls+'" data-id="'+id+'">'+
        '<span class="st"></span><span class="ic">'+t.icon+'</span><span class="nm">'+t.name+'</span></button>';
    }).join('');
  }

  dockEl.addEventListener('click', function(e){
    var item = e.target.closest('.dock-item');
    if(!item) return;
    var id = item.getAttribute('data-id');
    var w = winMap[id]; if(!w) return;
    if(w.status === 'min'){ restoreTool(id); }
    else if(activeId === id){ minimizeTool(id); }
    else { focusTool(id); }
  });
})();
</script>
</body>
</html>
